{% extends 'base.html' %}

{% block content %}
<div class="row">
  <div class="col-md-6 col-lg-5 mx-auto">
    <h1 class="my-4">Изменить пароль</h1>
    <div class="card">
      <div class="card-body">
        <form method="post" action="{{ url_for('change_password') }}" novalidate>
          <div class="mb-3">
            <label for="old_password" class="form-label">Старый пароль</label>
            <input type="password" class="form-control{% if errors.old_password %} is-invalid{% endif %}" id="old_password" name="old_password" value="{{ form.old_password }}" required>
            {% if errors.old_password %}<div class="invalid-feedback">{{ errors.old_password }}</div>{% endif %}
          </div>
          <div class="mb-3">
            <label for="new_password" class="form-label">Новый пароль</label>
            <input type="password" class="form-control{% if errors.new_password %} is-invalid{% endif %}" id="new_password" name="new_password" value="{{ form.new_password }}" required>
            {% if errors.new_password %}<div class="invalid-feedback">{{ errors.new_password }}</div>{% endif %}
          </div>
          <div class="mb-3">
            <label for="new_password2" class="form-label">Повторите новый пароль</label>
            <input type="password" class="form-control{% if errors.new_password2 %} is-invalid{% endif %}" id="new_password2" name="new_password2" value="{{ form.new_password2 }}" required>
            {% if errors.new_password2 %}<div class="invalid-feedback">{{ errors.new_password2 }}</div>{% endif %}
          </div>
          <button type="submit" class="btn btn-primary">Сохранить</button>
          <a href="{{ url_for('index') }}" class="btn btn-secondary ms-2">Отмена</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
