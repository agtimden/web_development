{% extends 'base.html' %}

{% block content %}
<div class="row">
  <div class="col-md-8 col-lg-6 mx-auto">
    <h1 class="my-4">Счётчик посещений</h1>
    <div class="card">
      <div class="card-body">
        <p class="mb-0">Вы посетили эту страницу <strong>{{ count }}</strong> раз(а).</p>
      </div>
    </div>
    <p class="text-muted mt-3">Обновите страницу, чтобы увеличить счётчик. Значение хранится в сессии браузера.</p>
  </div>
</div>
{% endblock %}
