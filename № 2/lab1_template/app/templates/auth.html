{% extends 'base.html' %}

{% block content %}
<div class="row">
  <div class="col-md-6 col-lg-5 mx-auto">
    <h1 class="my-4">Авторизация</h1>

    <div class="card">
      <div class="card-body">
        <form method="get" action="{{ url_for('request_data') }}">
          <div class="mb-3">
            <label for="login" class="form-label">Логин</label>
            <input type="text" class="form-control" id="login" name="login" placeholder="Введите логин" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Введите пароль" required>
          </div>
          <button type="submit" class="btn btn-primary">Войти</button>
        </form>
      </div>
    </div>

    <p class="text-muted mt-3">После отправки формы введённые данные будут показаны на странице «Данные запроса».</p>
  </div>
</div>
{% endblock %}
